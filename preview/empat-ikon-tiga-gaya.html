);

/* ─────────────────────────────────────────────── A · Jejak (satu goresan) */
const CheckJejak = ({ accent = "#C8952E", ...props }) => (
  <Frame title="Ceklis — Jejak" {...props}>
    {/* jejak yang ditelusuri sebelum ketemu */}
    <path
      d="M9 40.5c4.4 2.2 8.2 5 11.5 8.4"
      stroke="currentColor"
      strokeOpacity="0.28"
      strokeWidth="7"
      strokeLinecap="round"
      strokeDasharray="0.5 13"

      stroke="currentColor"
      strokeWidth="8"

);

/* ────────────────────────────────────── B · Sudut Enam (kisi heksagon 60°) */
const CheckHexcut = ({
  accent = "#C8952E",

  <Frame title="Ceklis — Sudut Enam" {...props}>
    {/* heksagon terbuka di sisi kanan-atas, ditembus ujung ceklis.

    {frame && (
      <path
        d="M50 9 17 28v38l33 19 33-19V44"

function Board({ styleKey, name }) {
  const s = SET[styleKey];
  const cats = [
    { Icon: s.Bag, label: "Tas & Dompet", on: true },
    { Icon: s.Keys, label: "Kunci", on: true },
    { Icon: s.Device, label: "HP & Elektronik", on: false },
    { Icon: s.Check, label: "Sudah kembali", on: false },
  ];
  return (
    <div className="board">
      <h3>Pilih kategori · {name}</h3>
      <div className="cats">
        {cats.map((c) => (
          <div className={c.on ? "cat on" : "cat"} key={c.label}>
            {c.on && (
              <span className="tick">
                <s.Check size={15} frame={false} />
              </span>
            )}
            <HexIcon Icon={c.Icon} on={c.on} />
            <span className="cname">{c.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}
